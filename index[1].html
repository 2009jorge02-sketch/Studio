<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#211b39"><title>Synthetix · Estudio inteligente</title>
<style>
:root{--ink:#211b39;--muted:#89869a;--line:#eceaf2;--wash:#f7f6fa;--violet:#6354e8;--soft:#f0efff;--side:#211b3a;--shadow:0 12px 36px rgba(40,31,77,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c9c3ff;outline-offset:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}.side{background:var(--side);color:#f6f4ff;padding:22px 15px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:10px;align-items:center;padding:0 5px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,#9389ff,#5f52dd);display:grid;place-items:center;font-size:19px}.brand b{display:block;font-size:15px}.brand small{color:#a9a4bf;font-size:11px}.search input{width:100%;padding:9px 11px;border:1px solid #39344f;background:#2b2543;color:white;border-radius:11px}.search input::placeholder{color:#a29cb5}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9994ab}.meter{padding:12px;background:#2b2543;border:1px solid #3b3554;border-radius:13px}.meter-line{display:flex;justify-content:space-between;font-size:11px;margin:6px 0;color:#d6d2e3}.meter-line strong{color:#c4bbff}.track{height:5px;background:#49435f;border-radius:9px;overflow:hidden}.track i{display:block;background:#9287ff;height:100%}
.tree{flex:1;overflow:auto}.tree-head{display:flex;justify-content:space-between;align-items:center;padding:0 5px 8px}.ic{border:0;background:transparent;color:inherit;border-radius:8px;width:27px;height:27px;font-size:16px}.ic:hover{background:rgba(255,255,255,.12)}.row{display:flex;align-items:center;gap:5px;min-height:34px;padding:3px 4px;border-radius:9px}.row:hover{background:rgba(255,255,255,.06)}.row-main{background:none;border:0;color:#e6e2f1;text-align:left;display:flex;gap:7px;align-items:center;flex:1;min-width:0;padding:4px}.row-main.active{background:#3a3456;border-radius:8px;color:#fff}.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.count{font-size:10px;color:#aaa4bf;margin-left:auto}.kids{margin-left:15px;border-left:1px solid #3d3854;padding-left:7px}.tree-actions{display:flex;opacity:.7}.tree-actions .ic{width:22px;height:22px;font-size:13px}.foot{border-top:1px solid #3c3654;padding-top:11px;display:grid;gap:7px}.foot button{border:1px solid #3c3654;background:#2b2543;color:#d6d2e3;border-radius:9px;text-align:left;padding:8px 10px;font-size:11px}.foot small{color:#9892ad;font-size:10px;padding-left:4px}
.main{min-width:0;display:flex;flex-direction:column}.top{background:white;border-bottom:1px solid var(--line);min-height:96px;padding:19px 25px;display:flex;align-items:center;justify-content:space-between;gap:16px}.crumb{font-size:10px;color:var(--muted)}h1,h2,h3,p{margin-top:0}.top h1{font:400 27px/1.2 Georgia,serif;letter-spacing:-.03em;margin:2px 0}.stats{font-size:11px;color:var(--muted)}.top-actions,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{border:1px solid #e5e2ee;background:white;border-radius:9px;color:#514d65;padding:8px 11px;font-size:11px;font-weight:600}.btn:hover{background:#f7f6ff}.primary{background:var(--violet);border-color:var(--violet);color:white}.primary:hover{background:#5445d6;color:white}.soft{background:var(--soft);border-color:#e4e1ff;color:#5d50cd}.danger{color:#b4415d}
.content{display:grid;grid-template-columns:minmax(300px,1fr) 310px;flex:1}.work{padding:24px;min-width:0}.panel{background:white;border-left:1px solid var(--line);padding:20px 17px}.panelhead{display:flex;gap:9px;align-items:center}.spark{width:33px;height:33px;border-radius:11px;background:var(--soft);color:var(--violet);display:grid;place-items:center}.panelhead h2{font-size:14px;margin:0}.panel-sub{font-size:10px;color:var(--muted);margin:4px 0 15px 42px}.tabs{display:flex;background:#f3f2f7;padding:3px;border-radius:9px;margin-bottom:15px}.tabs button{flex:1;border:0;background:none;border-radius:7px;padding:7px 3px;font-size:10px;color:#797588}.tabs .on{background:white;color:var(--violet);font-weight:700;box-shadow:0 2px 6px #211b3911}
.scopes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:13px}.scope{border:1px solid var(--line);border-radius:9px;background:white;padding:7px 2px;font-size:9px;color:#696579}.scope b{display:block;font-size:15px;font-weight:500}.scope.on{background:#f4f2ff;border-color:#cbc5ff;color:#5c4cdb}.field{display:grid;gap:4px;margin:10px 0}.field label{font-size:10px;color:#514d64;font-weight:600}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #e6e4ed;border-radius:9px;background:white;color:var(--ink)}.field textarea{min-height:290px;resize:vertical;line-height:1.7}.panel .primary{width:100%;margin:5px 0 12px}.history{border-top:1px solid var(--line);padding-top:10px}.history-title{font-weight:700;font-size:10px;margin-bottom:6px}.history-item{display:flex;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #f2f1f5}.history-item button.mainrow{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:0}.history-item strong{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-item small{color:#9692a1;font-size:9px}.pill{background:#f1efff;color:#5b4bd5;border-radius:20px;padding:3px 6px;font-size:9px}
.headrow{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:17px}.headrow h2{font:400 24px Georgia,serif;letter-spacing:-.02em;margin:3px 0 6px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:11px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:14px}.card h3{font-size:12px;margin:0}.card p{font-size:10px;color:#8f8b9a;margin:6px 0 10px}.notes{display:grid;gap:8px}.note-button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--ink)}.note-button:hover{border-color:#cfc9ff;background:#fcfbff}.noteicon,.emptyicon{background:var(--soft);color:var(--violet);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}.notetext{flex:1;min-width:0}.notetext strong{display:block;font-size:11px}.notetext small{display:block;color:#9995a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.empty{min-height:330px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;text-align:center;padding:25px}.empty-inner{max-width:340px}.emptyicon{width:58px;height:58px;border-radius:18px;font-size:24px;margin:0 auto 14px}.empty h2{font:400 22px Georgia,serif;margin:7px}.empty p{font-size:11px;color:#8c8998}.editor{background:white;border:1px solid var(--line);border-radius:14px;padding:17px}.editor textarea{min-height:290px}.hint{font-size:9px;color:#9995a6}.suggest{border:1px dashed #dfbb72;background:#fff9ee;border-radius:11px;padding:11px;margin:10px 0}.suggest strong{font-size:10px;color:#89651f}.suggest p{font-size:10px;color:#736547;margin:5px 0}.question{background:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}.question h3{font-size:12px;margin-bottom:8px}.option{display:flex;gap:7px;padding:6px;border-radius:7px;font-size:10px;color:#5e5b6c}.option:hover{background:#f7f6fb}.option input{accent-color:var(--violet);margin:2px}.notice{padding:9px 10px;border-radius:9px;background:#f1f0ff;color:#5e55b5;font-size:10px;margin:9px 0}.notice.ok{background:#eefaf3;color:#33794f}.progressbox{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;background:#fff}.progressbox strong{font-size:13px}.progressbox small{display:block;color:#908c9c;font-size:9px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#28223f;color:white;padding:9px 13px;border-radius:10px;font-size:11px;box-shadow:var(--shadow);z-index:10}.hide{display:none!important}
@media(max-width:1000px){.content{grid-template-columns:minmax(300px,1fr) 280px}.work{padding:18px}.panel{padding:17px 13px}}
@media(max-width:780px){.shell{grid-template-columns:1fr}.side{min-height:auto;padding:12px;gap:10px}.search,.meter,.tree,.foot{display:none}.brand{padding:0}.top{padding:15px;min-height:76px}.top h1{font-size:23px}.content{display:flex;flex-direction:column}.work{padding:14px;min-height:330px}.panel{border:0;border-top:1px solid var(--line);padding:15px}.headrow{flex-direction:column}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.cards{grid-template-columns:1fr}.top-actions{flex-direction:column;align-items:flex-end}.top h1{font-size:21px}}
.modal-mask{position:fixed;inset:0;background:rgba(23,18,41,.46);display:grid;place-items:center;padding:16px;z-index:30}.modal{width:min(390px,100%);background:#fff;border-radius:16px;padding:19px;box-shadow:0 22px 70px rgba(20,15,45,.3)}.modal h2{font:400 21px Georgia,serif;margin:2px 0 14px}.modal input{width:100%;border:1px solid #e6e4ed;border-radius:10px;padding:11px;color:var(--ink)}.modal-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}</style>
</head>
<body><div id="app"></div><div id="toast" class="toast hide"></div>
<script>
(function(){
"use strict";
var KEY="synthetix-study-v1";
function blank(){return{subjects:[],exams:[],selection:{},scope:"tema",panel:"examen",activeExam:null};}
var data;try{data=Object.assign(blank(),JSON.parse(localStorage.getItem(KEY)||"{}"));}catch(e){data=blank();}
var root=document.getElementById("app"),toast=document.getElementById("toast"),timer;
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function say(s){toast.textContent=s;toast.classList.remove("hide");clearTimeout(timer);timer=setTimeout(function(){toast.classList.add("hide");},3000);}
function subject(id){return data.subjects.find(function(x){return x.id===id;});}
function topic(id){for(var s of data.subjects){var t=s.topics.find(function(x){return x.id===id;});if(t)return{s:s,t:t};}return null;}
function session(id){for(var s of data.subjects)for(var t of s.topics)for(var q of t.sessions)if(q.id===id)return{s:s,t:t,q:q};return null;}
function note(id){for(var s of data.subjects)for(var t of s.topics)for(var q of t.sessions)for(var n of q.notes)if(n.id===id)return{s:s,t:t,q:q,n:n};return null;}
function topics(){return data.subjects.flatMap(function(s){return s.topics.map(function(t){return{s:s,t:t};});});}
function notes(){return data.subjects.flatMap(function(s){return s.topics.flatMap(function(t){return t.sessions.flatMap(function(q){return q.notes.map(function(n){return{s:s,t:t,q:q,n:n};});});});});}
function ctx(){var v=data.selection||{};if(v.note)return note(v.note);if(v.session)return session(v.session);if(v.topic)return topic(v.topic);if(v.subject){var s=subject(v.subject);return s?{s:s}:null;}return null;}
function avg(){var done=data.exams.filter(function(e){return e.done;});return done.length?Math.round(done.reduce(function(a,e){return a+e.score;},0)/done.length):0;}
function crumb(c){return c?[c.s&&c.s.name,c.t&&c.t.name,c.q&&c.q.name,c.n&&c.n.title].filter(Boolean).map(esc).join(" › "):"Tu biblioteca de estudio";}
function title(c){return data.activeExam?"Examen en curso":c&&c.n?c.n.title:c&&c.q?c.q.name:c&&c.t?c.t.name:c&&c.s?c.s.name:"Tu escritorio de estudio";}
function treeHtml(filter){var q=(filter||"").toLowerCase(),out="";if(!data.subjects.length)return'<small style="color:#aaa;padding:10px">Aún no hay asignaturas.</small>';data.subjects.forEach(function(s){var hit=s.name.toLowerCase().includes(q)||s.topics.some(function(t){return t.name.toLowerCase().includes(q)||t.sessions.some(function(z){return z.name.toLowerCase().includes(q);});});if(q&&!hit)return;out+='<div class="row"><button class="row-main '+(data.selection.subject===s.id?"active":"")+'" data-a="subject" data-id="'+s.id+'"><span>'+esc(s.icon||"📘")+'</span><span class="label">'+esc(s.name)+'</span><span class="count">'+s.topics.length+'</span></button><span class="tree-actions"><button class="ic" data-a="topic-add" data-id="'+s.id+'" title="Añadir tema">＋</button><button class="ic" data-a="del-subject" data-id="'+s.id+'" title="Eliminar">×</button></span></div><div class="kids">';s.topics.forEach(function(t){if(q&&!t.name.toLowerCase().includes(q)&&!t.sessions.some(function(z){return z.name.toLowerCase().includes(q);}))return;out+='<div class="row"><button class="row-main '+(data.selection.topic===t.id?"active":"")+'" data-a="topic" data-id="'+t.id+'"><span>•</span><span class="label">'+esc(t.name)+'</span><span class="count">'+t.sessions.length+'</span></button><span class="tree-actions"><button class="ic" data-a="session-add" data-id="'+t.id+'" title="Añadir sesión">＋</button><button class="ic" data-a="del-topic" data-id="'+t.id+'" title="Eliminar">×</button></span></div><div class="kids">';t.sessions.forEach(function(z){out+='<div class="row"><button class="row-main '+(data.selection.session===z.id?"active":"")+'" data-a="session" data-id="'+z.id+'"><span>◦</span><span class="label">'+esc(z.name)+'</span><span class="count">'+z.notes.length+'</span></button><span class="tree-actions"><button class="ic" data-a="del-session" data-id="'+z.id+'" title="Eliminar">×</button></span></div>';});out+='</div>';});out+='</div>';});return out;}
function empty(titleText,desc,action,label){return'<div class="empty"><div class="empty-inner"><div class="emptyicon">✦</div><div class="eyebrow">Qué vamos a aprender hoy</div><h2>'+esc(titleText)+'</h2><p>'+esc(desc)+'</p><button class="btn primary" data-a="'+action+'">'+esc(label)+'</button></div></div>';}
function overview(c){if(c&&c.s&&!c.t){var s=c.s;return'<div class="headrow"><div><div class="eyebrow">Asignatura</div><h2>'+esc(s.icon||"📘")+' '+esc(s.name)+'</h2><div class="stats">'+s.topics.length+' temas · '+s.topics.reduce(function(n,t){return n+t.sessions.length;},0)+' sesiones</div></div><button class="btn" data-a="topic-add" data-id="'+s.id+'">＋ Nuevo tema</button></div>'+(s.topics.length?'<div class="cards">'+s.topics.map(function(t){return'<div class="card"><h3>'+esc(t.name)+'</h3><p>'+t.sessions.length+' sesiones · '+t.sessions.reduce(function(n,q){return n+q.notes.length;},0)+' apuntes</p><button class="btn soft" data-a="topic" data-id="'+t.id+'">Abrir tema</button></div>';}).join("")+'</div>':empty("Tu primera unidad empieza aquí","Añade un tema para organizar sesiones y apuntes.","topic-add","Crear tema"));}
if(c&&c.t&&!c.q){var t=c.t;return'<div class="headrow"><div><div class="eyebrow">'+esc(c.s.name)+'</div><h2>'+esc(t.name)+'</h2><div class="stats">'+t.sessions.length+' sesiones · '+t.sessions.reduce(function(n,q){return n+q.notes.length;},0)+' apuntes</div></div><div class="actions"><button class="btn" data-a="exam-topic" data-id="'+t.id+'">Repasar tema</button><button class="btn primary" data-a="session-add" data-id="'+t.id+'">＋ Nueva sesión</button></div></div>'+(t.sessions.length?'<div class="cards">'+t.sessions.map(function(q){return'<div class="card"><h3>'+esc(q.name)+'</h3><p>'+q.notes.length+' apuntes</p><button class="btn soft" data-a="session" data-id="'+q.id+'">Abrir sesión</button> <button class="btn" data-a="note-add" data-id="'+q.id+'">＋ Apunte</button></div>';}).join("")+'</div>':empty("Crea una sesión de estudio","Divide este tema en sesiones y guarda apuntes en cada una.","session-add","Crear sesión"));}
if(c&&c.q&&!c.n){var q=c.q;return'<div class="headrow"><div><div class="eyebrow">'+esc(c.t.name)+'</div><h2>'+esc(q.name)+'</h2><div class="stats">'+q.notes.length+' apuntes guardados</div></div><div class="actions"><button class="btn" data-a="exam-session" data-id="'+q.id+'">Repasar sesión</button><button class="btn primary" data-a="note-add" data-id="'+q.id+'">＋ Nuevo apunte</button></div></div>'+(q.notes.length?'<div class="notes">'+q.notes.map(function(n){return'<button class="note-button" data-a="note" data-id="'+n.id+'"><span class="noteicon">▤</span><span class="notetext"><strong>'+esc(n.title||"Apunte")+'</strong><small>'+esc((n.org||n.raw||"").slice(0,100))+'</small></span></button>';}).join("")+'</div>':empty("Guarda tus ideas de esta sesión","Escribe apuntes y luego pide a la IA que los organice.","note-add","Crear primer apunte"));}
if(c&&c.n)return noteView(c);
return data.subjects.length?empty("Tu escritorio de estudio","Elige una asignatura a la izquierda o crea tu primera unidad.","subject-add","Nueva asignatura"):empty("Empieza con tu primera asignatura","Crea tu estructura de estudio y guarda sesiones y apuntes.","subject-add","Crear asignatura");}
function noteView(c){var n=c.n;return'<div class="headrow"><div><div class="eyebrow">'+crumb(c)+'</div><h2>'+esc(n.title||"Apunte")+'</h2></div><button class="btn danger" data-a="del-note" data-id="'+n.id+'">Eliminar apunte</button></div><div class="editor"><div class="field"><label>Título</label><input id="note-title" value="'+esc(n.title)+'"></div><div class="field"><label>Apuntes</label><textarea id="note-body">'+esc(n.org||n.raw||"")+'</textarea></div><div class="actions"><button class="btn primary" data-a="save-note" data-id="'+n.id+'">Guardar apunte</button><button class="btn soft" data-a="organize" data-id="'+n.id+'">✧ Organizar con IA</button><button class="btn" data-a="exam-note" data-id="'+n.id+'">Crear test</button></div>'+(n.suggestion?'<div class="suggest"><strong>La IA propone información adicional</strong><p>'+esc(n.suggestion)+'</p><div class="actions"><button class="btn soft" data-a="accept" data-id="'+n.id+'">Añadir con mi permiso</button><button class="btn danger" data-a="dismiss" data-id="'+n.id+'">Descartar</button></div></div>':"")+'</div>';}
function examView(e){return'<div class="headrow"><div><div class="eyebrow">'+esc(e.label)+'</div><h2>'+esc(e.title)+'</h2><div class="stats">'+e.questions.length+' preguntas · '+(e.done?"Resultado "+e.score+"%":"Responde con calma")+'</div></div><button class="btn" data-a="close-exam">Volver</button></div>'+(e.done?'<div class="notice ok">Examen completado y guardado en tu archivo.</div>':"")+e.questions.map(function(q,i){return'<div class="question"><h3>'+(i+1)+'. '+esc(q.question)+'</h3>'+q.options.map(function(o,j){return'<label class="option"><input type="radio" name="q'+i+'" data-a="answer" data-id="'+e.id+'" data-q="'+i+'" value="'+j+'" '+(e.answers[i]===j?"checked ":"")+(e.done?"disabled":"")+'><span>'+esc(o)+'</span></label>';}).join("")+(e.done?'<p class="hint">'+esc(q.explanation||"")+'</p>':"")+'</div>';}).join("")+(e.done?'<button class="btn danger" data-a="del-exam" data-id="'+e.id+'">Eliminar examen</button>':'<button class="btn primary" data-a="submit-exam" data-id="'+e.id+'">Entregar examen</button>');}
function historyHtml(){if(!data.exams.length)return'<div class="hint">Aún no hay exámenes guardados.</div>';return data.exams.slice().sort(function(a,b){return b.date-a.date;}).map(function(e){return'<div class="history-item"><button class="mainrow" data-a="'+(e.done?"open-exam":"open-exam")+'" data-id="'+e.id+'"><strong>'+esc(e.title)+'</strong><small>'+esc(e.label)+' · '+new Date(e.date).toLocaleDateString("es-ES")+'</small></button>'+(e.done?'<span class="pill">'+e.score+'%</span>':"")+'<button class="ic danger" data-a="del-exam" data-id="'+e.id+'">×</button></div>';}).join("");}
function panelHtml(){var tab=data.panel;var out='<div class="panelhead"><span class="spark">✧</span><h2>Panel de IA</h2></div><p class="panel-sub">Exámenes, permisos y progreso</p><div class="tabs"><button class="'+(tab==="examen"?"on":"")+'" data-a="panel" data-tab="examen">Examen</button><button class="'+(tab==="permisos"?"on":"")+'" data-a="panel" data-tab="permisos">Permisos</button><button class="'+(tab==="progreso"?"on":"")+'" data-a="panel" data-tab="progreso">Progreso</button></div>';
if(tab==="permisos"){var waiting=notes().filter(function(x){return x.n.suggestion;});return out+(waiting.length?waiting.map(function(x){return'<div class="suggest"><strong>'+esc(x.n.title)+'</strong><p>'+esc(x.n.suggestion)+'</p><button class="btn soft" data-a="accept" data-id="'+x.n.id+'">Añadir</button> <button class="btn danger" data-a="dismiss" data-id="'+x.n.id+'">Descartar</button></div>';}).join(""):'<div class="hint">Si la IA detecta contenido adicional o irrelevante, te pedirá permiso antes de guardarlo.</div>');}
if(tab==="progreso"){return out+'<div class="progressbox"><strong>'+avg()+'%</strong><small>Dominio medio en exámenes</small></div><div class="progressbox"><strong>'+data.exams.filter(function(e){return e.done;}).length+'</strong><small>Exámenes completados</small></div><div class="progressbox"><strong>'+notes().length+'</strong><small>Apuntes guardados</small></div><div class="history"><div class="history-title">Archivo de exámenes</div>'+historyHtml()+'</div><div class="hint">La información queda guardada en este navegador. Descarga una copia desde la barra lateral.</div>';}
var c=ctx(),scope=data.scope||"tema",tops=topics(),subId=c&&c.s?c.s.id:(data.subjects[0]&&data.subjects[0].id),activeTopic=c&&c.t?c.t.id:(tops[0]&&tops[0].t.id),ses=activeTopic&&topic(activeTopic)?topic(activeTopic).t.sessions:[];
return out+'<div class="scopes">'+[["sesion","◷","Sesión"],["tema","▣","Tema"],["rango","↔","Rango"],["global","✧","Global"]].map(function(x){return'<button class="scope '+(scope===x[0]?"on":"")+'" data-a="scope" data-scope="'+x[0]+'"><b>'+x[1]+'</b>'+x[2]+'</button>';}).join("")+'</div><div class="field"><label>Asignatura</label><select id="exam-subject">'+data.subjects.map(function(s){return'<option value="'+s.id+'" '+(s.id===subId?"selected":"")+'>'+esc(s.name)+'</option>';}).join("")+'</select></div>'+
(scope==="sesion"?'<div class="field"><label>Sesión</label><select id="exam-session">'+ses.map(function(q){return'<option value="'+q.id+'" '+(c&&c.q&&c.q.id===q.id?"selected":"")+'>'+esc(q.name)+'</option>';}).join("")+'</select></div>':scope==="tema"?'<div class="field"><label>Tema</label><select id="exam-topic">'+tops.map(function(x){return'<option value="'+x.t.id+'" '+(x.t.id===activeTopic?"selected":"")+'>'+esc(x.s.name+" · "+x.t.name)+'</option>';}).join("")+'</select></div>':scope==="rango"?'<div class="field"><label>Desde tema</label><select id="range-start">'+tops.map(function(x,i){return'<option value="'+x.t.id+'" '+(i===0?"selected":"")+'>'+esc(x.t.name)+'</option>';}).join("")+'</select></div><div class="field"><label>Hasta tema</label><select id="range-end">'+tops.map(function(x,i){return'<option value="'+x.t.id+'" '+(i===tops.length-1?"selected":"")+'>'+esc(x.t.name)+'</option>';}).join("")+'</select></div>':'<div class="notice">Usará los apuntes guardados en todas las asignaturas.</div>')+
'<div class="field"><label>Número de preguntas</label><select id="question-count">'+[3,5,8,10,15].map(function(x){return'<option value="'+x+'" '+(x===5?"selected":"")+'>'+x+' preguntas</option>';}).join("")+'</select></div><button class="btn primary" data-a="generate">Generar examen</button><div class="history"><div class="history-title">Exámenes guardados</div>'+historyHtml()+'</div>';}
function render(){var c=ctx(),avgVal=avg();root.innerHTML='<div class="shell"><aside class="side"><div class="brand"><span class="logo">✦</span><div><b>Synthetix</b><small>Estudio inteligente</small></div></div><div class="search"><input id="search" placeholder="⌕  Buscar..." aria-label="Buscar"></div><div class="meter"><div class="eyebrow">Dominio total</div><div class="meter-line"><span>Progreso personal</span><strong>'+avgVal+'%</strong></div><div class="track"><i style="width:'+avgVal+'%"></i></div></div><div class="tree"><div class="tree-head"><span class="eyebrow">Asignaturas</span><button class="ic" data-a="subject-add">＋</button></div>'+treeHtml("")+'</div><div class="foot"><button data-a="backup">↓ &nbsp; Descargar copia de seguridad</button><small>Guardado automáticamente en este navegador</small></div></aside><main class="main"><header class="top"><div><div class="crumb">'+crumb(c)+'</div><h1>'+esc(title(c))+'</h1><div class="stats">'+data.subjects.length+' asignaturas · '+topics().length+' temas · '+notes().length+' apuntes · Dominio '+avgVal+'%</div></div><div class="top-actions"><button class="btn" data-a="archive">Archivo</button><button class="btn primary" data-a="global">✧ Test global</button></div></header><section class="content"><div class="work">'+(data.activeExam?examView(data.exams.find(function(e){return e.id===data.activeExam;})):overview(c))+'</div><aside class="panel">'+panelHtml()+'</aside></section></main></div>';}
function askName(title,placeholder,onSave){var mask=document.createElement("div");mask.className="modal-mask";mask.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><form><input name="name" placeholder="'+esc(placeholder)+'" maxlength="100" required><div class="modal-foot"><button type="button" class="btn" data-close="1">Cancelar</button><button type="submit" class="btn primary">Crear</button></div></form></div>';document.body.appendChild(mask);var input=mask.querySelector("input");input.focus();mask.addEventListener("click",function(ev){if(ev.target===mask||ev.target.hasAttribute("data-close"))mask.remove();});mask.querySelector("form").addEventListener("submit",function(ev){ev.preventDefault();var value=input.value.trim();if(!value)return;mask.remove();onSave(value);});}
function addSubject(){askName("Nueva asignatura","Ej. Biología",function(name){var s={id:uid(),name:name,icon:"📘",topics:[]};data.subjects.push(s);data.selection={subject:s.id};save();render();say("Asignatura creada");});}
function addTopic(sid){var s=subject(sid||data.selection.subject)||data.subjects[0];if(!s){addSubject();return;}askName("Nuevo tema","Ej. Fotosíntesis",function(name){var t={id:uid(),name:name,sessions:[]};s.topics.push(t);data.selection={subject:s.id,topic:t.id};save();render();say("Tema creado");});}
function addSession(tid){var f=topic(tid||data.selection.topic);if(!f){say("Elige un tema primero");return;}askName("Nueva sesión","Ej. Sesión 1 · Introducción",function(name){var q={id:uid(),name:name,notes:[]};f.t.sessions.push(q);data.selection={subject:f.s.id,topic:f.t.id,session:q.id};save();render();say("Sesión creada");});}
function addNote(qid){var f=session(qid||data.selection.session);if(!f){say("Elige una sesión primero");return;}askName("Nuevo apunte","Ej. Conceptos principales",function(title){var n={id:uid(),title:title,raw:"",org:"",suggestion:"",date:Date.now()};f.q.notes.push(n);data.selection={subject:f.s.id,topic:f.t.id,session:f.q.id,note:n.id};save();render();});}
function remove(type,id){var msg=type==="subject"?"¿Eliminar esta asignatura y todo su contenido?":type==="topic"?"¿Eliminar este tema, sus sesiones y apuntes?":type==="session"?"¿Eliminar esta sesión y sus apuntes?":type==="note"?"¿Eliminar este apunte?":"¿Eliminar este examen guardado?";if(!confirm(msg+" No se puede deshacer."))return;
if(type==="subject"){data.subjects=data.subjects.filter(function(x){return x.id!==id;});if(data.selection.subject===id)data.selection={};}
if(type==="topic"){var f=topic(id);if(f)f.s.topics=f.s.topics.filter(function(x){return x.id!==id;});if(data.selection.topic===id)data.selection={subject:f.s.id};}
if(type==="session"){var f=session(id);if(f)f.t.sessions=f.t.sessions.filter(function(x){return x.id!==id;});if(data.selection.session===id)data.selection={subject:f.s.id,topic:f.t.id};}
if(type==="note"){var f=note(id);if(f)f.q.notes=f.q.notes.filter(function(x){return x.id!==id;});if(data.selection.note===id)data.selection={subject:f.s.id,topic:f.t.id,session:f.q.id};}
if(type==="exam"){data.exams=data.exams.filter(function(x){return x.id!==id;});if(data.activeExam===id)data.activeExam=null;}
save();render();say("Eliminado");}
function saveNote(id){var f=note(id);if(!f)return;f.n.title=document.getElementById("note-title").value.trim()||"Apunte";f.n.raw=document.getElementById("note-body").value;f.n.org="";save();render();say("Apunte guardado");}
function localOrganize(text){return text.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean).map(function(x){return x.charAt(0)==="•"||x.charAt(0)==="-"?x:"• "+x;}).join("\n\n");}
async function askAI(action,payload){var res=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:action,payload:payload})});if(!res.ok)throw Error("AI unavailable");return(await res.json()).result;}
async function organize(id){var f=note(id),text=document.getElementById("note-body").value;if(!text.trim()){say("Escribe apuntes primero");return;}f.n.raw=text;f.n.title=document.getElementById("note-title").value||f.n.title;save();say("Organizando apuntes…");try{var r=await askAI("organize",{text:text,subject:f.s.name,topic:f.t.name,session:f.q.name});f.n.org=r.organizedMarkdown||text;f.n.suggestion=(r.irrelevantSuggestions||[]).join("\n");say("Apuntes organizados");}catch(e){f.n.org=localOrganize(text);say("Formato local aplicado; activa la IA en el servidor para respuestas inteligentes");}save();render();}
function collect(){var scope=data.scope||"tema",items=notes(),label="Todos los temas";if(scope==="sesion"){var sid=document.getElementById("exam-session").value;items=items.filter(function(x){return x.q.id===sid;});var f=session(sid);label=f?f.q.name:"Sesión";}else if(scope==="tema"){var tid=document.getElementById("exam-topic").value;items=items.filter(function(x){return x.t.id===tid;});var f=topic(tid);label=f?f.t.name:"Tema";}else if(scope==="global"){label="Todos los temas";}else{var ids=topics().map(function(x){return x.t.id;}),a=ids.indexOf(document.getElementById("range-start").value),b=ids.indexOf(document.getElementById("range-end").value);if(a>b){var c=a;a=b;b=c;}var valid=ids.slice(a,b+1);items=items.filter(function(x){return valid.includes(x.t.id);});label="Rango de temas";}return{items:items,label:label,scope:scope};}
function localQuiz(text,count){var parts=text.split(/[\n.!?]+/).map(function(x){return x.trim();}).filter(function(x){return x.split(/\s+/).length>4;});return parts.slice(0,count).map(function(x,i){var distractors=parts.filter(function(_,j){return j!==i;});var original=[x,distractors[0]||"Esta idea no aparece en el texto.",distractors[1]||"No se menciona en los apuntes."],offset=i%3,options=original.slice(offset).concat(original.slice(0,offset));return{question:"¿Cuál de estas afirmaciones aparece en tus apuntes?",options:options,answerIndex:(3-offset)%3,explanation:"Respuesta basada en tus apuntes: "+x};});}
async function generate(){var selection=collect(),text=selection.items.map(function(x){return"Asignatura: "+x.s.name+"; Tema: "+x.t.name+"; Sesión: "+x.q.name+"\n"+(x.n.org||x.n.raw);}).join("\n\n");if(!text.trim()){say("Añade apuntes a esta selección primero");return;}say("Preparando el examen…");var count=Number(document.getElementById("question-count").value||5),questions,source="IA";try{var r=await askAI("quiz",{text:text,count:count,scope:selection.label});questions=(r.questions||[]).map(function(q){return{question:String(q.question||""),options:(q.options||[]).map(String),answerIndex:Number(q.answerIndex==null?q.answer_index:q.answerIndex),explanation:String(q.explanation||"")};}).filter(function(q){return q.question&&q.options.length>1;});}catch(e){questions=localQuiz(text,count);source="local";}if(!questions.length){say("No hay suficiente texto para generar preguntas");return;}var e={id:uid(),title:"Repaso · "+selection.label,label:selection.label,scope:selection.scope,questions:questions.slice(0,count),answers:{},done:false,score:0,date:Date.now(),source:source};data.exams.unshift(e);data.activeExam=e.id;save();render();say(source==="IA"?"Examen creado con IA":"Examen de ejemplo creado");}
function submit(id){var e=data.exams.find(function(x){return x.id===id;});if(!e)return;var correct=e.questions.filter(function(q,i){return Number(e.answers[i])===Number(q.answerIndex);}).length;e.score=Math.round(correct/e.questions.length*100);e.done=true;e.completed=Date.now();save();render();say("Resultado guardado: "+e.score+"%");}
function backup(){var b=new Blob([JSON.stringify({subjects:data.subjects,exams:data.exams,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="synthetix-estudio.json";a.click();URL.revokeObjectURL(a.href);say("Copia descargada");}
function action(ev){var b=ev.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
if(a==="subject-add")return addSubject();if(a==="topic-add")return addTopic(id);if(a==="session-add")return addSession(id);if(a==="note-add")return addNote(id);
if(a==="subject"){var s=subject(id);data.selection={subject:s.id};data.activeExam=null;}
if(a==="topic"){var f=topic(id);data.selection={subject:f.s.id,topic:f.t.id};data.activeExam=null;}
if(a==="session"){var f=session(id);data.selection={subject:f.s.id,topic:f.t.id,session:f.q.id};data.activeExam=null;}
if(a==="note"){var f=note(id);data.selection={subject:f.s.id,topic:f.t.id,session:f.q.id,note:f.n.id};data.activeExam=null;}
if(a==="del-subject")return remove("subject",id);if(a==="del-topic")return remove("topic",id);if(a==="del-session")return remove("session",id);if(a==="del-note")return remove("note",id);if(a==="del-exam")return remove("exam",id);
if(a==="save-note")return saveNote(id);if(a==="organize")return organize(id);
if(a==="accept"){var f=note(id);if(f){f.n.org=(f.n.org||f.n.raw)+"\n\nInformación adicional aprobada:\n"+f.n.suggestion;f.n.suggestion="";save();render();say("Añadida con tu permiso");}return;}
if(a==="dismiss"){var f=note(id);if(f){f.n.suggestion="";save();render();say("Sugerencia descartada");}return;}
if(a==="panel"){data.panel=b.dataset.tab;save();render();return;}if(a==="scope"){data.scope=b.dataset.scope;save();render();return;}
if(a==="generate")return generate();if(a==="global"){data.scope="global";data.panel="examen";save();render();return generate();}
if(a==="exam-topic"){data.selection.topic=id;data.scope="tema";data.panel="examen";save();render();return generate();}
if(a==="exam-session"){data.selection.session=id;data.scope="sesion";data.panel="examen";save();render();return generate();}
if(a==="exam-note"){var f=note(id);data.selection={subject:f.s.id,topic:f.t.id,session:f.q.id};data.scope="sesion";data.panel="examen";save();render();return generate();}
if(a==="open-exam"){data.activeExam=id;save();render();return;}if(a==="close-exam"){data.activeExam=null;save();render();return;}if(a==="submit-exam")return submit(id);if(a==="backup")return backup();if(a==="archive"){data.panel="progreso";save();return render();}
save();render();}
root.addEventListener("click",action);
root.addEventListener("change",function(ev){if(ev.target.id==="search"){var v=ev.target.value;document.querySelector(".tree").innerHTML='<div class="tree-head"><span class="eyebrow">Asignaturas</span><button class="ic" data-a="subject-add">＋</button></div>'+treeHtml(v);return;}if(ev.target.matches('[data-a="answer"]')){var e=data.exams.find(function(x){return x.id===ev.target.dataset.id;});if(e){e.answers[ev.target.dataset.q]=Number(ev.target.value);save();}}if(ev.target.id==="exam-topic"){var f=topic(ev.target.value);if(f)data.selection={subject:f.s.id,topic:f.t.id};save();render();}});
render();
})();
</script></body></html>
